<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Easemap</title>
<style>
  :root { --bg: #ffffff; --text: #14181f; --muted: #4f5866; --link: #0b5f58; --rule: #d8dde3; --note-bg: #f2f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --text: #eef1f5; --muted: #a9b2bf; --link: #5eead4; --rule: #2a313b; --note-bg: #161b22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  p, li { max-width: 40rem; }
  ul { padding-left: 1.25rem; }
  li { margin: 4px 0; }
  a { color: var(--link); text-underline-offset: 2px; }
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .note { background: var(--note-bg); border-left: 4px solid var(--link); padding: 12px 16px; margin: 16px 0; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--bg); padding: 8px 12px; }
  .skip:focus { left: 8px; }
  nav ul { columns: 2; column-gap: 24px; padding-left: 1.25rem; }
  @media (max-width: 520px) { nav ul { columns: 1; } }
</style>
</head>
<body>
<main>
<h1>Easemap</h1>
<p>A private, offline body pain log. Tap where it hurts and see what is there.</p>
<p><a href="support.html">Support</a> &middot; <a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
